<style>
/* ============================================================
   ESTILOS — paleta calorosa, mobile-first, sem zoom/pull-to-refresh
   ============================================================ */
:root{

.btn{border-radius:14px;padding:.6rem 1rem;font-weight:700;transition:transform .12s,filter .12s;cursor:pointer;border:none}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--gold);color:#fff}
.btn-s{background:var(--bg2);color:var(--ink)}
.btn-g{background:transparent;color:var(--ink2);border:1px solid var(--linha)}
.fadeIn{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.popIn{animation:popIn .28s cubic-bezier(.2,1.4,.5,1) both}
@keyframes bouncePiece{0%{transform:translateY(-14px) scale(1.05)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
.batendo{animation:bouncePiece .3s ease both}
@keyframes pulsar{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28);opacity:.65}}
.pulsando{animation:pulsar 1.4s infinite}
@keyframes girar{0%{transform:rotate(0) scale(1)}100%{transform:rotate(720deg) scale(1.1)}}
.dado-girando{animation:girar .7s ease-in-out}
@keyframes flutuar{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{transform:translateY(-90px) scale(1);opacity:0}}
.emoji-voador{position:fixed;font-size:56px;pointer-events:none;z-index:9000;animation:flutuar 2s ease-out forwards}
/* tabuleiros */

.cel-vitoria{box-shadow:0 0 0 3px var(--gold), 0 0 22px var(--gold);animation:pulsar 1.1s infinite}

<script type="module">
/* ============================================================
   MESA DA FAMÍLIA — app de jogos em família (arquivo único)
   ------------------------------------------------------------
   COMO PUBLICAR (GitHub Pages + Firebase):
   1) Crie um projeto no Firebase Console (console.firebase.google.com).
   2) Authentication → Sign-in method → ative o provedor "Anônimo".
   3) Firestore Database → criar banco em modo produção e publicar:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} {
              allow read, write: if request.auth != null;
            }
          }
        }
   4) Configurações do Projeto → Seus apps → Web → copie as credenciais
      e substitua o objeto firebaseConfig logo abaixo.
   5) Suba este index.html no GitHub Pages (branch main, raiz).
   6) Abra a URL, escolha quem você é e crie o PIN da família (4 dígitos).
   7) No celular: Compartilhar → "Adicionar à Tela de Início" (vira app).
   ============================================================ */

/* ============================================================
   1. FIREBASE INIT
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, deleteDoc,
  query, where, orderBy, limit, onSnapshot, serverTimestamp, increment

const firebaseConfig = {
  apiKey: "AIzaSyAYwRsnJWXOJDyi9nSxaCl6Knsq9Zhe1F4",
  authDomain: "jogos-familia-56da1.firebaseapp.com",
  projectId: "jogos-familia-56da1",
  storageBucket: "jogos-familia-56da1.firebasestorage.app",
  messagingSenderId: "1067292563166",
  appId: "1:1067292563166:web:21437a02308f80b4e0944f",
  measurementId: "G-V3WLKZC8CL"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ============================================================
   APP_CONFIG — tudo que é "personalidade" do app fica aqui
   ============================================================ */
const APP_CONFIG = {
  nome: "Mesa da Família",
  versao: "1.0.0",
  jogadores: {
    douglas:  { nome: "Douglas",  emoji: "💙", cor: "#4A90D9" },
    danilo:   { nome: "Danilo",   emoji: "💚", cor: "#5E9B87" },
    giovanna: { nome: "Giovanna", emoji: "💗", cor: "#E08AA6" },
    rebekah:  { nome: "Rebekah",  emoji: "💜", cor: "#9B7BC9" }
  },
  frases: [
    "Quem joga junto, ri junto. 🎲",
    "Aqui ninguém perde de verdade — todo mundo joga de novo. 🌱",
    "Mesa posta, irmãos reunidos. 💙💚💗💜",
    "Devagar também é jeito de ganhar. 🐢",
    "Provocação só vale se terminar em abraço. 🤗",
    "Hoje tem revanche? Sempre tem. 😄",
    "A graça não é ganhar — é jogar com vocês.",
    "Café, sofá e um tabuleiro no meio. ☕"
  ],
  categoriasForca: ["Nome de filme", "Cidade", "Comida", "Apelido de família", "Música", "Animal"],
  frasesRapidas: ["Boa! 👏", "Vou te pegar 😏", "Pensa bem 🤔", "Bora de novo?", "Essa foi boa 😂", "Ai ai ai… 😅"],
  zoacoes: ["😂", "😜", "🤪", "👀", "🍀", "🔥", "😇", "🙃"],
  regras: {
    velha: "Tabuleiro 3×3. Um é ❌, outro é ⭕ (sorteio no início). Três em linha vence. Melhor de 5: quem chegar a 3 vitórias leva. Empate é 'deu velha' 🤝 e conta como rodada.",
    dama: "Peão anda uma casa pra frente e captura pra frente e pra trás. Dama anda quantas casas quiser na diagonal. Captura é obrigatória. Vence quem eliminar tudo ou deixar o outro sem jogada. 20 lances sem captura (ou dama × dama) = empate.",
    domino: "28 peças (duplo-seis). 7 peças por jogador. Sem peça jogável? Compra do monte. Vence quem bater primeiro ou quem tiver menos pontos se o jogo fechar. Partidas em melhor de 3.",
    ludo: "4 peões cada. Só sai da casa com 6. Casas com ⭐ são seguras. Caiu em cima do adversário? Ele volta pra casa. Vence quem levar os 4 peões ao centro.",
    xadrez: "Regras completas: roque, en passant, promoção. Xeque-mate vence; afogamento empata. Toque numa peça pra ver os lances possíveis.",
    pifpaf: "9 cartas na mão. Compre do monte ou do lixo e descarte uma. Vence quem organizar 9 cartas em 3 trincas/sequências. Curingas substituem qualquer carta.",
    vinteum: "Chegue perto de 21 sem estourar. Ás vale 1 ou 11, figuras valem 10. A banca compra até 17. Cada um começa com 100 fichas.",
    forca: "Um irmão cria a palavra secreta. Os outros chutam letra por letra. Seis erros e o mestre leva a rodada."
  }
};

const NOMES = Object.keys(APP_CONFIG.jogadores);
const corDe  = n => (APP_CONFIG.jogadores[n]?.cor   || "#D4A574");
const emojiDe= n => (APP_CONFIG.jogadores[n]?.emoji || "🎲");
const nomeDe = n => (APP_CONFIG.jogadores[n]?.nome  || n);

/* ============================================================
   2. AUTENTICAÇÃO / SESSÃO / PIN
   ============================================================ */
const S = {
  uid: null, usuario: null, perfil: null,
  perfis: {}, configFamilia: null,
  salaId: null, sala: null, chat: [],
  som: true, notif: true, tema: "claro",
  unsubSala: null, unsubChat: null, unsubPerfis: null, unsubSalas: null,
  tela: "login", telaAnterior: "home", chatAberto: false,
  salasCache: [], ultimoTurno: null
};

/* ---------- utilidades gerais ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const agora = () => Date.now();
const gerarCodigo = () => {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
};
const haMinutos = ts => {
  if (!ts) return "agora";
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const m = Math.floor((agora() - ms) / 60000);
  if (m < 1) return "agora mesmo";
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h} h`;
  return `há ${Math.floor(h / 24)} d`;
};
const hojeChave = () => new Date().toISOString().slice(0, 10);
const hashTexto = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; };
const fraseDoDia = () => APP_CONFIG.frases[hashTexto(hojeChave()) % APP_CONFIG.frases.length];

/* ---------- toasts e modais ---------- */
function toast(msg, ms = 3200) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.classList.add("sai"); setTimeout(() => el.remove(), 420); }, ms);
}

/* Contador global de modais: garante que só limpamos o HTML do modal
   que efetivamente fechou — e não o de um modal novo aberto em seguida. */
let modalSeq = 0;

function modal({ titulo, html, botoes = [], fecharFora = true, onMount }) {
  return new Promise(resolve => {
    const root = $("#modalRoot"), caixa = $("#modalCaixa");
    const seq = ++modalSeq;

    caixa.innerHTML = `
      <h3 class="titulo text-2xl font-bold mb-3">${titulo}</h3>
      <div class="text-[15px] leading-relaxed" style="color:var(--ink)">${html}</div>
      <div class="flex flex-wrap gap-2 mt-5 justify-end">
        ${botoes.map((b, i) => `<button data-i="${i}" class="btn ${b.classe || "btn-s"}">${b.texto}</button>`).join("")}
      </div>`;
    root.classList.add("aberto");

    const fora = e => { if (e.target === root && fecharFora) fechar(null); };

    // ⚠️ ORDEM IMPORTANTE: resolve() PRIMEIRO, limpa depois (setTimeout 0).
    // Isso garante que o caller do `await modal(...)` consiga ler inputs
    // que ainda estão no DOM. Só limpamos se um novo modal não abriu.
    const fechar = val => {
      root.classList.remove("aberto");
      root.removeEventListener("click", fora);
      resolve(val);
      setTimeout(() => {
        if (seq === modalSeq) caixa.innerHTML = "";
      }, 0);
    };

    // Permite que quem chamou conecte eventos internos do modal
    // enquanto ele ainda está aberto (chips, cartas, emojis etc.).
    if (typeof onMount === "function") {
      try { onMount(caixa, fechar); } catch (e) {}
    }

    root.addEventListener("click", fora);
    $$("button[data-i]", caixa).forEach(b =>
      b.addEventListener("click", () => fechar(botoes[+b.dataset.i].valor))
    );
  });
}

const confirmar = async (titulo, texto) =>
  (await modal({ titulo, html: `<p>${texto}</p>`, botoes: [
      { texto: "Cancelar", valor: false, classe: "btn-s" },
      { texto: "Confirmar", valor: true, classe: "btn-p" }] })) === true;

/* ---------- confete ---------- */
function confete(forca = 1) {
  const cv = $("#confete"), ctx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const cores = ["#D4A574", "#4A90D9", "#5E9B87", "#E08AA6", "#9B7BC9", "#F5D67B"];
  const partes = Array.from({ length: Math.round(90 * forca) }, () => ({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4,
    vx: (Math.random() - .5) * 2.2, vy: 2 + Math.random() * 3.4,
    s: 5 + Math.random() * 7, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .25,
    c: cores[Math.floor(Math.random() * cores.length)]
  }));
  let frames = 0;
  (function anim() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    partes.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += 0.035;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
    });
    frames++;
    if (frames < 210) requestAnimationFrame(anim);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- emoji voador (zoação carinhosa) ---------- */
function emojiVoador(emoji, alvo) {
  const el = document.createElement("div");
  el.className = "emoji-voador";
  el.textContent = emoji;
  el.style.left = (30 + Math.random() * 40) + "%";
  el.style.bottom = "18%";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2100);
  if (alvo) enviarMensagem(`${emoji} (zoação carinhosa)`, true);
}

/* ============================================================
   16. SONS — Web Audio API sintetizada (sem arquivos externos)
   ============================================================ */
let audioCtx = null;
const ctxAudio = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
function nota(freq, dur, tipo = "sine", vol = .16, atraso = 0) {
  if (!S.som) return;
  try {
    const c = ctxAudio(), o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.value = freq;
    const t = c.currentTime + atraso;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .03);
  } catch (e) {}
}
const SONS = {
  playPieceMove:   () => nota(320, .09, "square", .13),
  playPiecePlace:  () => { nota(520, .10, "triangle", .15); nota(700, .12, "sine", .10, .07); },

  playChatMessage: () => { nota(880, .16, "sine", .10); nota(1180, .22, "sine", .07, .09); },
  playYourTurn:    () => { nota(990, .14, "triangle", .14); nota(1320, .18, "triangle", .11, .1); },

};
const tocarSom = nome => { try { SONS[nome]?.(); } catch (e) {} };

/* ============================================================
   3. FIRESTORE CRUD
   ============================================================ */
const refPerfil = n => doc(db, "perfis", n);
const refSala   = id => doc(db, "partidas", id);
const refConfig = () => doc(db, "config", "familia");

async function lerConfigFamilia() {
  const snap = await getDoc(refConfig());
  S.configFamilia = snap.exists() ? snap.data() : null;
  return S.configFamilia;
}
async function criarConfigFamilia(pin, apelidos) {
  const dados = {
    pin,
    nomes: apelidos,
    criado_em: serverTimestamp()
  };
  await setDoc(refConfig(), dados);
  S.configFamilia = { ...dados, criado_em: { toMillis: () => agora() } };
}
async function atualizarPin(novoPin) {
  await updateDoc(refConfig(), { pin: novoPin });
  S.configFamilia.pin = novoPin;
}

/** Garante que o documento do perfil existe; cria com os padrões da família. */
async function garantirPerfil(nome) {
  const snap = await getDoc(refPerfil(nome));
  const base = {
    nome,
    apelido_exibido: nomeDe(nome),
    emoji: emojiDe(nome),
    cor: corDe(nome),
    total_partidas: 0,
    ultima_vez_online: serverTimestamp()
  };
  if (!snap.exists()) {
    const vitorias = {}; JOGOS_LISTA.forEach(j => vitorias[j] = 0);
    await setDoc(refPerfil(nome), { ...base, vitorias });
  } else {
    await updateDoc(refPerfil(nome), { ultima_vez_online: serverTimestamp() });
  }
}

/** Cria uma sala nova e devolve o código. */
async function criarSala(jogo, jogadores) {
  const id = gerarCodigo();
  const estado = JOGOS[jogo].novoEstado(jogadores);
  await setDoc(refSala(id), {
    jogo,
    jogadores,
    estado,
    turno: JOGOS[jogo].primeiroTurno ? JOGOS[jogo].primeiroTurno(estado, jogadores) : jogadores[0],
    vencedor: null,
    empate: false,
    status: "jogando",
    rodada: 1,
    placar_rodadas: Object.fromEntries(jogadores.map(j => [j, 0])),
    criada_por: S.usuario,
    criada_em: serverTimestamp(),
    atualizada_em: serverTimestamp()
  });
  return id;
}

/** Entra numa sala existente; adiciona o jogador se houver vaga. */
async function entrarNaSala(salaId) {
  const snap = await getDoc(refSala(salaId));
  if (!snap.exists()) throw new Error("Sala não encontrada");
  const dados = snap.data();
  if (dados.status === "finalizada") throw new Error("Essa mesa já foi encerrada");
  const jog = dados.jogadores || [];
  if (!jog.includes(S.usuario)) {
    const max = JOGOS[dados.jogo].maxJogadores;
    if (jog.length >= max) throw new Error("A mesa já está cheia");
    const novos = [...jog, S.usuario];
    await updateDoc(refSala(salaId), { jogadores: novos, atualizada_em: serverTimestamp() });
  }
  return salaId;
}

/** Salva o estado da sala (merge raso de campos de topo). */
async function salvarSala(dados) {
  if (!S.salaId) return;
  await updateDoc(refSala(S.salaId), { ...dados, atualizada_em: serverTimestamp() });
}
async function salvarEstadoSala(salaId, estadoNovo, extras = {}) {
  await updateDoc(refSala(salaId), { estado: estadoNovo, ...extras, atualizada_em: serverTimestamp() });
}

/** Envia mensagem no chat da sala atual. */
async function enviarMensagem(texto, silencioso = false) {
  if (!S.salaId || !texto.trim()) return;
  await addDoc(collection(db, "chat"), {
    sala_id: S.salaId,
    autor: S.usuario,
    texto: texto.trim().slice(0, 200),
    enviado_em: serverTimestamp()
  });
  if (!silencioso) tocarSom("playChatMessage");
}

/** Registra vitória/partida no perfil. */
async function registrarResultado(jogo, vencedor, empatou) {
  try {
    const campos = { total_partidas: increment(1), ultima_vez_online: serverTimestamp() };
    if (vencedor) campos[`vitorias.${jogo}`] = increment(1);
    await updateDoc(refPerfil(vencedor || S.usuario), campos);
    if (empatou) {
      for (const j of (S.sala?.jogadores || [])) {
        if (j !== S.usuario) await updateDoc(refPerfil(j), { total_partidas: increment(1) });
      }
    }
  } catch (e) { /* silencioso: placar é secundário */ }
}

/** Calcula o placar geral a partir dos perfis. */
function calcularPlacarGeral() {
  const linhas = NOMES.map(n => {
    const p = S.perfis[n] || {};
    const v = p.vitorias || {};
    const total = Object.values(v).reduce((a, b) => a + (b || 0), 0);
    return { nome: n, vitorias: v, total, partidas: p.total_partidas || 0 };
  });
  linhas.sort((a, b) => b.total - a.total);
  return linhas;
}

function irPara(tela) {
  S.telaAnterior = S.tela === tela ? S.telaAnterior : S.tela;

}

function render() {
  $("#quemSou").innerHTML = S.usuario
    ? `<span style="color:${corDe(S.usuario)}">${emojiDe(S.usuario)} ${esc(nomeDe(S.usuario))}</span>` : "";
  switch (S.tela) {
    case "login":  return renderLogin();
    case "home":   return renderHome();
    case "salas":  return renderSalas();
    case "jogo":   return renderTelaJogo();
    case "placar": return renderPlacar();

}

function ouvirPerfis() {
  S.unsubPerfis?.();
  S.unsubPerfis = onSnapshot(collection(db, "perfis"), snap => {
    S.perfis = {};
    snap.forEach(d => S.perfis[d.id] = d.data());

}
const estaOnline = nome => {
  const p = S.perfis[nome]; if (!p?.ultima_vez_online) return false;
  const ms = p.ultima_vez_online.toMillis ? p.ultima_vez_online.toMillis() : p.ultima_vez_online;
  return agora() - ms < 75000;
};

async function abrirPin(nome) {
  tocarSom("playClick");
  let cfg;
  try { cfg = await lerConfigFamilia(); }
  catch (e) { toast("Sem conexão com o Firebase. Verifique o firebaseConfig."); return; }

  if (!cfg) { await configuracaoInicial(nome); return; }

  let digitado = "";
  const pintar = () => {
    $$(".pin-dot").forEach((d, i) => {
      d.style.background = i < digitado.length ? corDe(nome) : "var(--linha)";
    });
  };
  const root = $("#modalRoot"), caixa = $("#modalCaixa");
  caixa.innerHTML = `
    <h3 class="titulo text-2xl font-bold mb-1 text-center">Oi, ${esc(nomeDe(nome))}! ${emojiDe(nome)}</h3>
    <p class="text-center mb-4" style="color:var(--ink2)">Digite o PIN da família</p>
    <div class="flex justify-center gap-3 mb-5">
      ${[0,1,2,3].map(() => `<div class="pin-dot" style="width:16px;height:16px;border-radius:50%;background:var(--linha)"></div>`).join("")}
    </div>
    <div class="grid grid-cols-3 gap-2 max-w-[240px] mx-auto">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn btn-s text-xl py-3" data-n="${n}">${n}</button>`).join("")}
      <button class="btn btn-g text-xl py-3" data-limpar>⌫</button>
      <button class="btn btn-s text-xl py-3" data-n="0">0</button>
      <button class="btn btn-g text-xl py-3" data-fechar>✕</button>
    </div>
    <p id="pinErro" class="text-center text-sm mt-3" style="color:var(--giovanna);min-height:20px"></p>`;
  root.classList.add("aberto");
  pintar();

  const finalizar = ok => {
    root.classList.remove("aberto"); caixa.innerHTML = "";
    if (ok) entrarComo(nome);
  };
  caixa.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.fechar !== undefined) return finalizar(false);
    if (b.dataset.limpar !== undefined) { digitado = digitado.slice(0, -1); pintar(); return; }
    if (b.dataset.n !== undefined && digitado.length < 4) {
      digitado += b.dataset.n; pintar(); tocarSom("playClick");
      if (digitado.length === 4) {
        const cfgAtual = await lerConfigFamilia();
        if (String(cfgAtual?.pin) === digitado) { tocarSom("playPiecePlace"); finalizar(true); }
        else {
          tocarSom("playErrorSound");
          $("#pinErro").textContent = "PIN diferente… tenta de novo 💙";
          digitado = ""; setTimeout(pintar, 260);
        }
      }
    }
  });
}

  });

  // O modal já resolveu a Promise, mas o innerHTML ainda está intacto

}

async function entrarComo(nome) {
  S.usuario = nome;
  sessionStorage.setItem("mf_usuario", nome);
  await garantirPerfil(nome);
  S.perfil = S.perfis[nome] || null;
  ouvirPerfis();
  iniciarHeartbeat();
  tocarSom("playYourTurn");
  irPara("home");
  const params = new URLSearchParams(location.search);
  const sala = params.get("sala");
  if (sala) {
    try { await entrarNaSala(sala.toUpperCase()); abrirSala(sala.toUpperCase()); }
    catch (e) { toast(e.message); }
  }
}

let heartbeatId = null;
function iniciarHeartbeat() {
  clearInterval(heartbeatId);
  const bater = () => { if (S.usuario) updateDoc(refPerfil(S.usuario), { ultima_vez_online: serverTimestamp() }).catch(() => {}); };
  bater();
  heartbeatId = setInterval(bater, 25000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) bater(); });
}

/* ---------- escolher quem joga e criar a mesa ---------- */
async function escolherModo(jogo) {
  const g = JOGOS[jogo];
  const outros = NOMES.filter(n => n !== S.usuario);
  const selecionados = new Set([S.usuario]);
  const max = g.maxJogadores;

  const r = await modal({
    titulo: `${g.icone} ${esc(g.nome)}`,
    html: `
      <p class="mb-3" style="color:var(--ink2)">${esc(g.descricaoLonga || g.descricao)}</p>
      <p class="font-bold text-sm mb-2">Quem vai jogar? (até ${max})</p>
      <div class="flex flex-wrap gap-2">
        ${[S.usuario, ...outros].map(n => `
          <button data-p="${n}" class="chip" style="${n === S.usuario ? `background:${corDe(n)};color:#fff;border-color:${corDe(n)}` : ""}">
            ${emojiDe(n)} ${esc(nomeDe(n))}
          </button>`).join("")}
      </div>
      <p class="text-xs mt-3" style="color:var(--ink2)">Você já está na mesa. Pode jogar sozinho contra a banca/máquina ou esperar os irmãos entrarem pelo link.</p>`,
    botoes: [
      { texto: "Cancelar", valor: null, classe: "btn-s" },
      { texto: "Criar mesa 🎲", valor: "ok", classe: "btn-p" }
    ],
    // Conecta os cliques nos chips ENQUANTO o modal está aberto.
    onMount(caixa) {
      caixa.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
        const n = b.dataset.p;
        if (n === S.usuario) return;
        if (selecionados.has(n)) {
          selecionados.delete(n);
          b.style.background = ""; b.style.color = ""; b.style.borderColor = "";
        } else if (selecionados.size < max) {
          selecionados.add(n);
          b.style.background = corDe(n); b.style.color = "#fff"; b.style.borderColor = corDe(n);
        } else {
          toast(`Máximo de ${max} jogadores nesse jogo`);
        }
      }));
    }
  });
  if (r !== "ok") return;

  const jogadores = [S.usuario, ...outros.filter(n => selecionados.has(n))].slice(0, max);
  try {
    const id = await criarSala(jogo, jogadores.length ? jogadores : [S.usuario]);
    abrirSala(id);
    toast(`Mesa criada! Código ${id}`);
  } catch (e) { toast("Não deu pra criar a mesa: " + e.message); }
}

          <button class="btn btn-p" data-entrar="${s.id}">Entrar</button>
        </div>`;
      }).join("") : `<div class="card p-6 text-center" style="color:var(--ink2)">Nenhuma mesa aberta agora. Que tal criar uma? 🎲</div>`}
    </div>
    <button id="btnNovaSala" class="btn btn-p w-full py-3 mt-5"><i class="fa-solid fa-plus mr-2"></i>Nova mesa</button>
  </div>`;
  $$("[data-entrar]").forEach(b => b.addEventListener("click", async () => {
    try { await entrarNaSala(b.dataset.entrar); abrirSala(b.dataset.entrar); }
    catch (e) { toast(e.message); }
  }));
  $("#btnNovaSala").onclick = () => {
    modal({
      titulo: "Nova mesa 🎲",
      html: `<p class="mb-3" style="color:var(--ink2)">Escolha o jogo:</p>
             <div class="grid grid-cols-2 gap-2">
               ${JOGOS_LISTA.map(j => `<button data-nj="${j}" class="btn btn-s py-3">${JOGOS[j].icone} ${esc(JOGOS[j].nome)}</button>`).join("")}
             </div>`,
      botoes: [{ texto: "Fechar", valor: null, classe: "btn-g" }],
      onMount(caixa, fechar) {
        caixa.querySelectorAll("[data-nj]").forEach(b => b.addEventListener("click", () => {
          const jogo = b.dataset.nj;
          fechar(null);
          // pequeno delay pra garantir que a limpeza do modal anterior
          // não interfira no novo modal que será aberto por escolherModo.
          setTimeout(() => escolherModo(jogo), 10);
        }));
      }
    });
  };
}

/* ============================================================
   TELA 3 — JOGO (renderização dinâmica)
   ============================================================ */
function abrirSala(salaId) {
  S.salaId = salaId;
  history.replaceState(null, "", `${location.pathname}?sala=${salaId}`);
  irPara("jogo");
  ouvirSalaAtual();
  ouvirChat();
}
function fecharSala() {
  S.unsubSala?.(); S.unsubChat?.();
  S.salaId = null; S.sala = null; S.chat = [];
  history.replaceState(null, "", location.pathname);
}

function ouvirSalaAtual() {
  S.unsubSala?.();
  S.unsubSala = onSnapshot(refSala(S.salaId), snap => {
    if (!snap.exists()) { toast("A mesa foi encerrada"); fecharSala(); irPara("home"); return; }
    const anterior = S.sala;
    const nova = { id: snap.id, ...snap.data() };
    S.sala = nova;

    if (anterior && anterior.turno !== nova.turno && nova.turno === S.usuario && nova.status === "jogando") {
      tocarSom("playYourTurn");
      vibrar([40, 60, 40]);
      toast(`É sua vez, ${nomeDe(S.usuario)}! ${emojiDe(S.usuario)}`);
      notificar("É sua vez!", `Sua vez no ${JOGOS[nova.jogo].nome}, ${nomeDe(S.usuario)} ${emojiDe(S.usuario)}`);
    }
    if (anterior && !anterior.vencedor && nova.vencedor) {
      tocarSom("playVictory"); confete(1.3);
      vibrar([60, 80, 60, 80, 120]);
      notificar("Vitória! 🏆", `${nomeDe(nova.vencedor)} ganhou no ${JOGOS[nova.jogo].nome}`);
      S._ultimaVitoria = { nome: nova.vencedor, jogo: nova.jogo };
      if (nova.vencedor === S.usuario) registrarResultado(nova.jogo, nova.vencedor, false);
    }
    if (anterior && !anterior.empate && nova.empate) {
      tocarSom("playPiecePlace");
      toast(`Deu velha 🤝 — boa partida, gente!`);
    }
    if (S.tela === "jogo") renderTelaJogo();
  }, () => {});
}

function ouvirChat() {
  S.unsubChat?.();
  S.unsubChat = onSnapshot(
    query(collection(db, "chat"), where("sala_id", "==", S.salaId)),
    snap => {
      const antes = S.chat.length;
      S.chat = snap.docs.map(d => d.data())
        .sort((a, b) => (a.enviado_em?.toMillis?.() || 0) - (b.enviado_em?.toMillis?.() || 0))
        .slice(-40);
      if (S.chat.length > antes && antes > 0) {
        const ultima = S.chat[S.chat.length - 1];
        if (ultima.autor !== S.usuario) {
          tocarSom("playChatMessage"); vibrar(30);
          toast(`${emojiDe(ultima.autor)} ${nomeDe(ultima.autor)}: ${ultima.texto}`);
        }
      }
      if (S.tela === "jogo") pintarChat();
    }, () => {});
}

/** Títulos afetivos por jogo. */
function tituloAfetivo(sala) {
  const outros = (sala.jogadores || []).filter(n => n !== S.usuario);
  const quem = outros.length ? nomeDe(outros[0]) : "os irmãos";
  switch (sala.jogo) {
    case "velha":  return `Velha rapidinha com ${quem}?`;
    case "dama":   return `Bora jogar uma dama, ${nomeDe(S.usuario)}?`;
    case "domino": return "Mesinha de dominó com os manos";
    case "ludo":   return "Ludo — a corrida da família";
    case "xadrez": return "Xadrez — estratégia de família";
    case "pifpaf": return "Pife-Paf: quem bate primeiro?";
    case "vinteum":return "21 — chega perto sem estourar";
    case "forca":  return "Forca — palavras da nossa casa";
  }
  return JOGOS[sala.jogo].nome;
}

/* ============================================================
   5. ROTEADOR DE JOGOS — registro dos 8 jogos
   ============================================================ */
const JOGOS_LISTA = ["velha", "dama", "domino", "ludo", "xadrez", "pifpaf", "vinteum", "forca"];
const JOGOS = {};

/* ============================================================
   6. JOGO DA VELHA
   ============================================================ */
JOGOS.velha = {
  nome: "Jogo da Velha", icone: "❌⭕", minJogadores: 1, maxJogadores: 2,
  descricao: "Rapidinho de 3 em linha",
  descricaoLonga: "Melhor de 5: quem chegar a 3 vitórias leva a partida.",
  novoEstado(jogadores) {
    const simbolos = {};
    const ordem = [...jogadores].sort(() => Math.random() - .5);
    ordem.forEach((n, i) => simbolos[n] = i === 0 ? "X" : "O");
    return {
      tabuleiro: Array(9).fill(null),
      simbolos,
      ordem,
      rodada: 1,
      vitorias: Object.fromEntries(jogadores.map(j => [j, 0])),
      historico: [],
      linhaVencedora: null,
      fimRodada: null
    };
  },
  primeiroTurno(estado) { return estado.ordem[0]; },
  render(area, sala) {
    const e = sala.estado;
    const eu = S.usuario;
    const vez = sala.turno;
    const empate = e.fimRodada === "empate";
    const vencedorRodada = e.fimRodada && e.fimRodada !== "empate"
      ? Object.keys(e.simbolos).find(k => e.simbolos[k] === e.fimRodada) : null;

    area.innerHTML = `
      <div class="card p-4">
        <div class="flex justify-between items-center mb-3 text-sm">
          ${(sala.jogadores || []).map(n => `
            <div class="flex items-center gap-1 font-bold" style="color:${corDe(n)}">
              ${e.simbolos?.[n] === "X" ? "❌" : "⭕"} ${esc(nomeDe(n))}
              <span class="ml-1 px-2 rounded-full" style="background:var(--bg2);color:var(--ink)">${e.vitorias?.[n] || 0}</span>
            </div>`).join("")}
        </div>
        <div class="tab-velha" id="tabVelha">
          ${e.tabuleiro.map((c, i) => `
            <div class="cel ${e.linhaVencedora?.includes(i) ? "cel-vitoria" : ""}" data-i="${i}"
                 style="${c ? `color:${c === "X" ? "var(--douglas)" : "var(--giovanna)"}` : ""}">
              ${c ? `<span class="popIn">${c === "X" ? "❌" : "⭕"}</span>` : ""}
            </div>`).join("")}
        </div>
        <div class="text-center mt-4">
          ${e.fimRodada
            ? (empate
                ? `<div class="font-extrabold text-lg">Deu velha 🤝</div>`
                : `<div class="font-extrabold text-lg" style="color:${corDe(vencedorRodada)}">
                     ${emojiDe(vencedorRodada)} ${esc(nomeDe(vencedorRodada))} venceu a rodada! 🎉</div>`)
            : `<div class="font-extrabold" style="color:${corDe(vez)}">
                 Vez de ${esc(nomeDe(vez))} ${emojiDe(vez)}</div>`}
        </div>
        ${e.fimRodada ? `<button id="velhaProxima" class="btn btn-p w-full mt-3">Jogar de novo 🔁</button>` : ""}
        <div class="mt-4 text-xs" style="color:var(--ink2)">
          Rodadas: ${(e.historico || []).map((h, i) =>
            `<span class="inline-block mx-1 px-2 py-0.5 rounded-full" style="background:var(--bg2)">
               ${i + 1}: ${h === "empate" ? "🤝" : (h === "X" ? "❌" : "⭕")}</span>`).join("") || "nenhuma ainda"}
        </div>
      </div>`;

    $$("#tabVelha .cel").forEach(cel => cel.addEventListener("click", async () => {
      if (e.fimRodada || vez !== eu) { tocarSom("playErrorSound"); return; }
      const i = +cel.dataset.i;
      if (e.tabuleiro[i]) { tocarSom("playErrorSound"); return; }
      if (!validarJogadaVelha(e.tabuleiro, i)) return;

      const tab = [...e.tabuleiro];
      tab[i] = e.simbolos[eu];
      const res = verificarVencedorVelha(tab);
      const novo = { ...e, tabuleiro: tab };

      if (res) {
        novo.fimRodada = res;
        novo.linhaVencedora = res === "empate" ? null : linhasVencedoras(tab).find(l => l.every(x => tab[x] === res)) || null;
        if (res !== "empate") novo.vitorias = { ...e.vitorias, [eu]: (e.vitorias[eu] || 0) + 1 };
        novo.historico = [...(e.historico || []), res];
        const campeao = Object.keys(novo.vitorias).find(k => novo.vitorias[k] >= 3);
        tocarSom(res === "empate" ? "playPiecePlace" : "playVictory");
        await salvarSala({
          estado: novo,
          empate: res === "empate",
          vencedor: campeao || null,
          status: campeao ? "finalizada" : "jogando",
          placar_rodadas: novo.vitorias
        });
        if (!campeao) toast("Rodada terminada! Bora pra próxima 🎲");
      } else {
        tocarSom("playPiecePlace");
        vibrar(20);
        const outro = sala.jogadores.find(n => n !== eu) || eu;
        await salvarSala({ estado: novo, turno: outro, vencedor: null, empate: false });
      }
    }));

    const btn = $("#velhaProxima");
    if (btn) btn.onclick = async () => {
      const ordem = [...(e.ordem || sala.jogadores)].reverse();
      const estado = {
        ...e,
        tabuleiro: Array(9).fill(null),
        ordem,
        rodada: (e.rodada || 1) + 1,
        linhaVencedora: null,
        fimRodada: null
      };
      await salvarSala({ estado, turno: ordem[0], vencedor: null, empate: false, status: "jogando" });
      tocarSom("playPieceMove");
    };
  }
};
function validarJogadaVelha(tabuleiro, posicao) {
  return posicao >= 0 && posicao < 9 && !tabuleiro[posicao];
}
const LINHAS_VELHA = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function linhasVencedoras(t) { return LINHAS_VELHA.filter(l => t[l[0]] && t[l[0]] === t[l[1]] && t[l[1]] === t[l[2]]); }
function verificarVencedorVelha(tabuleiro) {
  const l = linhasVencedoras(tabuleiro);
  if (l.length) return tabuleiro[l[0][0]];
  return tabuleiro.every(c => c) ? "empate" : null;
}

/* ============================================================
   7. DAMA (checkers brasileiro)
   ============================================================ */
const DIR_DAMA = { 0: [1, 1], 1: [1, -1], 2: [-1, -1], 3: [-1, 1] };

JOGOS.dama = {
  nome: "Dama", icone: "🟥", minJogadores: 2, maxJogadores: 4,
  descricao: "8×8, captura obrigatória",
  descricaoLonga: "2 jogadores ou 4 (duplas). Captura é obrigatória e em cadeia!",
  novoEstado(jogadores) {
    const n = jogadores.length;
    const casas = Array.from({ length: 8 }, () => Array(8).fill(null));
    const definir = (l, c, dono) => { casas[l][c] = { d: dono, r: false }; };
    if (n <= 2) {
      for (let l = 0; l < 3; l++) for (let c = 0; c < 8; c++) if ((l + c) % 2 === 1) definir(l, c, jogadores[0]);
      for (let l = 5; l < 8; l++) for (let c = 0; c < 8; c++) if ((l + c) % 2 === 1) definir(l, c, jogadores[1]);
    } else {
      const zonas = [
        { l: [0, 2], c: [0, 2] }, { l: [0, 2], c: [5, 7] },
        { l: [5, 7], c: [5, 7] }, { l: [5, 7], c: [0, 2] }
      ];
      zonas.forEach((z, i) => {
        for (let l = z.l[0]; l <= z.l[1]; l++) for (let c = z.c[0]; c <= z.c[1]; c++)
          if ((l + c) % 2 === 1) definir(l, c, jogadores[i]);
      });
    }
    return {
      casas,
      modo: n <= 2 ? 2 : 4,
      duplas: n > 2,
      semCaptura: 0,
      pecaObrigatoria: null,
      ultimoLance: null
    };
  },
  render(area, sala) {
    const e = sala.estado, eu = S.usuario;
    const meus = sala.jogadores;
    const meuIndice = meus.indexOf(eu);
    const vezIdx = meus.indexOf(sala.turno);
    const minhaVez = sala.turno === eu;

    const dirDe = idx => DIR_DAMA[e.modo === 2 ? (idx === 0 ? 0 : 2) : idx];
    const donosDoMeuTime = e.duplas
      ? meus.filter((_, i) => i % 2 === meuIndice % 2) : [eu];

    const selecionada = e.ultimoLance?.selecionada;
    const movs = selecionada ? movimentosDaPeca(e, selecionada[0], selecionada[1], dirDe(vezIdx)) : [];

    area.innerHTML = `
      <div class="card p-3">
        <div class="tab8" id="tabDama">
          ${e.casas.map((linha, l) => linha.map((casa, c) => {
            const clara = (l + c) % 2 === 0;
            const sel = selecionada && selecionada[0] === l && selecionada[1] === c;
            const dest = movs.some(m => m.para[0] === l && m.para[1] === c);
            const ult = e.ultimoLance && ((e.ultimoLance.de[0] === l && e.ultimoLance.de[1] === c) ||
                                          (e.ultimoLance.para[0] === l && e.ultimoLance.para[1] === c));
            return `<div class="cel ${clara ? "clara" : "escura"} ${sel ? "sel" : ""} ${dest ? "destino" : ""}"
                         data-l="${l}" data-c="${c}" style="${ult ? "outline:2px solid var(--gold);outline-offset:-2px" : ""}">
              ${casa ? `<div class="popIn" style="width:74%;height:74%;border-radius:50%;
                    background:${corDe(casa.d)};border:2px solid rgba(255,255,255,.9);
                    display:flex;align-items:center;justify-content:center;font-size:min(4vw,18px)">
                    ${casa.r ? "♛" : ""}</div>` : ""}
            </div>`;
          }).join("")).join("")}
        </div>
        <div class="text-center mt-3 font-extrabold" style="color:${corDe(sala.turno)}">

        </div>
        <div class="text-center text-xs mt-1" style="color:var(--ink2)">
          ${e.pecaObrigatoria ? "Captura em cadeia — continue com a mesma peça!" : "Captura é obrigatória quando existir."}
          ${e.semCaptura ? ` · ${e.semCaptura}/20 lances sem captura` : ""}

    $$("#tabDama .cel").forEach(cel => cel.addEventListener("click", async () => {

      const dir = dirDe(vezIdx);

      if (selecionada) {
        const mov = movs.find(m => m.para[0] === l && m.para[1] === c);
        if (mov) return executarMovimentoDama(sala, e, mov, dir);
      }
      if (casa && donosDoMeuTime.includes(casa.d)) {
        if (e.pecaObrigatoria && (e.pecaObrigatoria[0] !== l || e.pecaObrigatoria[1] !== c)) {
          tocarSom("playErrorSound"); toast("Você precisa continuar a captura com a mesma peça 🔴"); return;
        }
        const lista = movimentosDaPeca(e, l, c, dir);
        const capturasGlobais = todasCapturas(e, donosDoMeuTime, dir);
        if (capturasGlobais.length && !lista.some(m => m.captura)) {

};

function dirsJogador(idx, modo) { return DIR_DAMA[modo === 2 ? (idx === 0 ? 0 : 2) : idx]; }

function movimentosDaPeca(e, l, c, dir) {
  const casa = e.casas[l][c]; if (!casa) return [];
  const out = [];
  const sentidos = casa.r ? [[1,1],[1,-1],[-1,1],[-1,-1]] : [dir, [-dir[0], -dir[1]]];
  for (const [dr, dc] of sentidos) {
    const l1 = l + dr, c1 = c + dc;
    if (casa.r) {
      let ll = l1, cc = c1;
      while (dentro(ll, cc) && !e.casas[ll][cc]) { out.push({ de: [l, c], para: [ll, cc], captura: false }); ll += dr; cc += dc; }
    } else if (dentro(l1, c1) && !e.casas[l1][c1] && dirValida(dir, dr, dc, false)) {
      out.push({ de: [l, c], para: [l1, c1], captura: false });
    }
    if (casa.r) {
      let ll = l + dr, cc = c + dc;
      while (dentro(ll, cc) && !e.casas[ll][cc]) { ll += dr; cc += dc; }
      if (dentro(ll, cc) && e.casas[ll][cc] && e.casas[ll][cc].d !== casa.d) {
        const l2 = ll + dr, c2 = cc + dc;
        if (dentro(l2, c2) && !e.casas[l2][c2]) out.push({ de: [l, c], para: [l2, c2], captura: [ll, cc] });
      }
    } else {
      const l2 = l + dr * 2, c2 = c + dc * 2;
      const meio = e.casas[l1]?.[c1];
      if (dentro(l2, c2) && meio && meio.d !== casa.d && !e.casas[l2][c2]) {
        out.push({ de: [l, c], para: [l2, c2], captura: [l1, c1] });
      }
    }
  }
  return out;
}
const dentro = (l, c) => l >= 0 && l < 8 && c >= 0 && c < 8;
function dirValida(dir, dr, dc, captura) {
  if (dir[0] === dr && dir[1] === dc) return true;
  if (captura && -dir[0] === dr && -dir[1] === dc) return true;
  return false;
}
function todasCapturas(e, donos, dir) {
  const out = [];
  for (let l = 0; l < 8; l++) for (let c = 0; c < 8; c++) {
    const p = e.casas[l][c];
    if (p && donos.includes(p.d)) out.push(...movimentosDaPeca(e, l, c, dir).filter(m => m.captura));
  }
  return out;
}

async function executarMovimentoDama(sala, e, mov, dir) {
  const casas = e.casas.map(l => l.map(c => c ? { ...c } : null));
  const peca = casas[mov.de[0]][mov.de[1]];
  casas[mov.de[0]][mov.de[1]] = null;
  casas[mov.para[0]][mov.para[1]] = peca;
  let semCaptura = e.semCaptura;
  if (mov.captura) {
    casas[mov.captura[0]][mov.captura[1]] = null;
    semCaptura = 0;
    tocarSom("playCapture"); vibrar(60);
  } else {
    semCaptura = (e.semCaptura || 0) + 1;
    tocarSom("playPieceMove"); vibrar(20);
  }
  if (!e.duplas) {
    const idx = sala.jogadores.indexOf(peca.d);
    const linhaFinal = idx === 0 ? 7 : 0;
    if (!peca.r && mov.para[0] === linhaFinal) { peca.r = true; tocarSom("playVictory"); toast("Virou dama! ♛"); }
  }

  const novo = { ...e, casas, semCaptura, ultimoLance: { de: mov.de, para: mov.para, captura: mov.captura || null } };

  const continuacoes = mov.captura ? movimentosDaPeca(novo, mov.para[0], mov.para[1], dir).filter(m => m.captura) : [];
  if (continuacoes.length && mov.captura) {
    novo.pecaObrigatoria = mov.para;
    novo.ultimoLance.selecionada = mov.para;
    await salvarSala({ estado: novo });
    toast("Continue capturando! 🔴");
    return;
  }
  novo.pecaObrigatoria = null;

  const restantes = novo.casas.flat().filter(p => p && timeDe(p.d, sala) !== timeDe(sala.turno, sala));
  const meusRestantes = novo.casas.flat().filter(p => p && timeDe(p.d, sala) === timeDe(sala.turno, sala));

  if (restantes.length === 0) {
    return finalizarDama(sala, sala.turno, novo, "Todas as peças do outro time foram capturadas!");
  }
  if (meusRestantes.length === 0) {
    const outro = sala.jogadores.find(n => n !== sala.turno);
    return finalizarDama(sala, outro, novo, "Sem peças pra jogar!");
  }

  const proximo = proximoTurno(sala);
  const dirProx = dirsJogador(sala.jogadores.indexOf(proximo), e.modo);
  const temMov = novo.casas.flat().some((p, i) => p && p.d === proximo &&
    movimentosDaPeca(novo, Math.floor(i / 8), i % 8, dirProx).length > 0);
  if (!temMov) {
    return finalizarDama(sala, sala.turno, novo, `${nomeDe(proximo)} ficou sem jogadas!`);
  }

  const pecasRestantes = novo.casas.flat().filter(Boolean);
  const soDamas = pecasRestantes.every(p => p.r);
  if (novo.semCaptura >= 20 || (soDamas && pecasRestantes.length <= 2)) {
    return salvarSala({ estado: novo, empate: true, vencedor: null, status: "finalizada" })
      .then(() => toast("Empate — jogo longo demais ou só damas na mesa 🤝"));
  }

  await salvarSala({ estado: novo, turno: proximo, vencedor: null, empate: false });
  vibrar(20);
}
function timeDe(nome, sala) {
  if (!sala.estado.duplas) return nome;
  const i = sala.jogadores.indexOf(nome);
  return i % 2 === 0 ? "A" : "B";
}
function finalizarDama(sala, vencedor, estado, motivo) {
  return salvarSala({
    estado, vencedor: vencedor, empate: false, status: "finalizada"
  }).then(() => {
    toast(motivo);
    confete(1.2);
  });
}

function pontasMesa(mesa, pecaDe) {

async function jogarDomino(sala, e, id, pontas) {

    else if (peca.a === esq) mesa.unshift({ id, invertida: true });

function cartaHTML(c) {
  const verm = c.n === "♥" || c.n === "♦";
  return `<div class="carta ${verm ? "verm" : ""}">
    <span class="canto">${c.r === "JOKER" ? "★" : c.r}${c.r === "JOKER" ? "" : c.n}</span>
    <span class="centro">${c.r === "JOKER" ? "🃏" : c.n}</span>
    <span class="canto b">${c.r === "JOKER" ? "★" : c.r}${c.r === "JOKER" ? "" : c.n}</span>
  </div>`;
}
function acharCombinacao(cartas) {
  if (cartas.length === 10) {
    for (let i = 0; i < cartas.length; i++) {
      const resto = cartas.filter((_, j) => j !== i);
      const r = particionar(resto);
      if (r) return r;
    }
    return null;
  }
  return particionar(cartas);
}
function particionar(cartas) {
  if (cartas.length !== 9) return null;
  const resultado = [];
  const combinar = (restantes, grupos) => {
    if (!restantes.length) { if (grupos.length === 3) { resultado.push(...grupos); return true; } return false; }
    for (let a = 0; a < restantes.length - 2; a++)
      for (let b = a + 1; b < restantes.length - 1; b++)
        for (let c = b + 1; c < restantes.length; c++) {
          const g = [restantes[a], restantes[b], restantes[c]];
          if (grupoValido(g)) {
            const resto = restantes.filter((_, i) => i !== a && i !== b && i !== c);
            if (combinar(resto, [...grupos, g])) return true;
          }
        }
    return false;
  };
  const ok = combinar(cartas, []);
  return ok ? resultado : null;
}
function grupoValido(g) {
  const jokers = g.filter(c => c.r === "JOKER").length;
  const reais = g.filter(c => c.r !== "JOKER");
  if (jokers === 3) return true;
  if (reais.length && reais.every(c => c.r === reais[0].r)) return true;
  if (reais.length && reais.every(c => c.n === reais[0].n)) {
    for (const mapa of [VALOR_RANK, { ...VALOR_RANK, A: 14 }]) {
      const vals = reais.map(c => mapa[c.r]).sort((a, b) => a - b);
      if (new Set(vals).size !== vals.length) continue;
      let faltando = 0;
      for (let i = 1; i < vals.length; i++) faltando += vals[i] - vals[i - 1] - 1;
      if (faltando <= jokers && vals[vals.length - 1] - vals[0] <= 4) return true;
    }
  }
  return false;
}
function descreverCombinacao(comb) {
  return comb.map(g => g.map(c => c.r === "JOKER" ? "🃏" : c.r + c.n).join(" ")).join(" | ");
}

function baralho21() {
  const c = []; let id = 0;
  NAIPES.forEach(n => RANKS.forEach(r => c.push({ id: id++, r, n })));
  return c.sort(() => Math.random() - .5);
}
const valorMao = mao => {
  let total = 0, ases = 0;
  mao.forEach(c => {
    if (c.r === "A") { ases++; total += 11; }
    else if (["J","Q","K"].includes(c.r)) total += 10;
    else total += +c.r;
  });
  while (total > 21 && ases > 0) { total -= 10; ases--; }
  return total;
};

async function passarVez21(e, sala, estourou) {
  const idx = sala.jogadores.indexOf(sala.turno);
  const proximo = sala.jogadores[idx + 1];
  if (proximo) {
    return salvarSala({ estado: e, turno: proximo });
  }
  const baralho = [...e.baralho];
  const banca = [...e.banca];
  while (valorMao(banca) < 17 && baralho.length) banca.push(baralho.pop());
  const totalBanca = valorMao(banca);
  const resultados = {};
  const fichas = { ...e.fichas };
  let algumGanhou = null;
  sala.jogadores.forEach(n => {
    const t = valorMao(e.maos[n] || []);
    if (t > 21) { resultados[n] = "estourou"; }
    else if (totalBanca > 21 || t > totalBanca) { resultados[n] = "ganhou"; fichas[n] += (e.apostas[n] || 0) * 2; algumGanhou = algumGanhou || n; }
    else if (t === totalBanca) { resultados[n] = "empate"; fichas[n] += (e.apostas[n] || 0); }
    else { resultados[n] = "perdeu"; }
  });
  tocarSom(algumGanhou ? "playVictory" : "playDefeat");
  if (algumGanhou) confete(1);
  await salvarSala({
    estado: { ...e, baralho, banca, resultados, fichas, fase: "fim" },
    vencedor: algumGanhou, empate: !algumGanhou, status: algumGanhou ? "finalizada" : "jogando"
  });
}

            <div class="text-xs" style="color:var(--ink2)">
              ${l.total} vitória${l.total === 1 ? "" : "s"} · ${l.partidas} partida${l.partidas === 1 ? "" : "s"}
            </div>
          </div>
          <div class="text-right text-xs" style="color:var(--ink2)">
            ${JOGOS_LISTA.filter(j => l.vitorias[j]).map(j => `${JOGOS[j].icone}${l.vitorias[j]}`).join(" ") || "—"}
          </div>
        </div>`).join("")}
    </div>

    <div class="card p-4 mt-4">
      <h2 class="titulo text-xl font-bold mb-2">Troféu da semana 🏅</h2>
      <p class="text-sm" style="color:var(--ink2)">
        ${(() => {
          const melhor = [...linhas].sort((a, b) => b.total - a.total)[0];
          return melhor && melhor.total
            ? `${emojiDe(melhor.nome)} <b>${esc(nomeDe(melhor.nome))}</b> está na frente com ${melhor.total} vitória(s)!`
            : "Ainda sem vitórias registradas nesta semana. Bora jogar? 🎲";
        })()}
      </p>
    </div>

    <button id="plVoltar" class="btn btn-s w-full py-3 mt-5">Voltar pra home</button>
  </div>`;

  const ctx = $("#graficoPlacar");
  if (ctx && window.Chart) {
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: NOMES.map(nomeDe),
        datasets: JOGOS_LISTA.map(j => ({
          label: JOGOS[j].nome,
          data: NOMES.map(n => (S.perfis[n]?.vitorias?.[j] || 0)),
          backgroundColor: corDe(NOMES[JOGOS_LISTA.indexOf(j)]) + "CC"
        }))
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: getComputedStyle(document.body).color, font: { family: "Nunito" } } } },
        scales: {
          x: { stacked: true, ticks: { color: getComputedStyle(document.body).color }, grid: { display: false } },
          y: { stacked: true, ticks: { color: getComputedStyle(document.body).color }, grid: { color: "rgba(150,150,150,.2)" }, beginAtZero: true }
        }
      }
    });
  }
  $("#plVoltar").onclick = () => irPara("home");
}

/* ============================================================
   18. PWA — manifest, ícone em canvas, bloqueios de gesto
   ============================================================ */
function gerarIcone() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, "#FBF7F0"); grad.addColorStop(1, "#F3E4CC");
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  g.font = "260px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🎲", 256, 276);
  return c.toDataURL("image/png");
}
function montarPWA() {
  const icone = gerarIcone();
  $("#icone").href = icone;
  const manifest = {
    name: APP_CONFIG.nome,
    short_name: "Mesa",
    start_url: ".",
    display: "standalone",
    background_color: "#FBF7F0",
    theme_color: "#FBF7F0",
    orientation: "portrait",
    icons: [
      { src: icone, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: icone, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  $("#manifest").href = URL.createObjectURL(blob);
}
function bloquearGesto() {
  document.addEventListener("contextmenu", e => {
    if (e.target.closest("input, textarea")) return;
    e.preventDefault();
  });
  document.addEventListener("gesturestart", e => e.preventDefault());
  let ultimoToque = 0;
  document.addEventListener("touchend", e => {
    const agoraMs = Date.now();
    if (agoraMs - ultimoToque <= 300) e.preventDefault();
    ultimoToque = agoraMs;
  }, { passive: false });
  document.addEventListener("touchmove", e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
}
async function notificar(titulo, corpo) {
  if (!S.notif) return;
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try { new Notification(titulo, { body: corpo, icon: $("#icone").href }); } catch (e) {}
  } else if (Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch (e) {}
  }
}

/* ============================================================
   19. EVENTOS / BOOT
   ============================================================ */
function aplicarTema() {
  document.documentElement.classList.toggle("dark", S.tema === "escuro");
  $("#btnTema").innerHTML = S.tema === "escuro"
    ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
}
function carregarPreferencias() {
  S.som = localStorage.getItem("mf_som") !== "0";
  S.notif = localStorage.getItem("mf_notif") !== "0";
  S.tema = localStorage.getItem("mf_tema") || "claro";
  aplicarTema();
}
function ligarEventosGlobais() {
  $("#btnVoltar").onclick = () => {
    if (S.tela === "jogo") { fecharSala(); }
    irPara("home");
  };
  $("#btnTema").onclick = () => {
    S.tema = S.tema === "escuro" ? "claro" : "escuro";
    localStorage.setItem("mf_tema", S.tema);
    aplicarTema();
    if (S.tela === "placar") renderPlacar();
  };
  $("#btnChatTopo").onclick = () => {
    if (S.tela === "jogo") { S.chatAberto = !S.chatAberto; $("#chatPainel")?.classList.toggle("aberto", S.chatAberto); }
    else toast("Entre numa mesa pra conversar 💬");
  };
  window.addEventListener("popstate", () => {
    if (!location.search.includes("sala=") && S.salaId) { fecharSala(); irPara("home"); }
  });
}

/* ---------- partida inicial ---------- */
carregarPreferencias();
ligarEventosGlobais();
montarPWA();
bloquearGesto();

onAuthStateChanged(auth, async user => {
  if (!user) {
    try { await signInAnonymously(auth); }
    catch (e) {
      $("#conteudo").innerHTML = `<div class="p-8 text-center">
        <h2 class="titulo text-2xl mb-2">Ops! 😅</h2>
        <p style="color:var(--ink2)">Não consegui falar com o Firebase. Confira o <b>firebaseConfig</b> e as regras do Firestore.</p>
      </div>`;
    }
    return;
  }
  S.uid = user.uid;
  ouvirPerfis();
  ouvirSalas();
  try { await lerConfigFamilia(); } catch (e) {}

  const salvo = sessionStorage.getItem("mf_usuario");
  if (salvo && APP_CONFIG.jogadores[salvo]) {
    S.usuario = salvo;
    await garantirPerfil(salvo);
    iniciarHeartbeat();
    irPara("home");
    const sala = new URLSearchParams(location.search).get("sala");
    if (sala) {
      try { await entrarNaSala(sala.toUpperCase()); abrirSala(sala.toUpperCase()); }
      catch (e) { toast(e.message); }
    }
  } else {
    irPara("login");
  }
});
</script>
